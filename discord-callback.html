<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Discord Connection - vouch.gg</title>
<style>
body {
  background: #000;
  color: #fff;
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  text-align: center;
  padding: 40px;
}
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #2F3336;
  border-top-color: #1D9BF0;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.message {
  font-size: 18px;
  color: #71767B;
  margin-top: 16px;
}
</style>
</head>
<body>
<div class="container">
  <div class="spinner"></div>
  <h1>Connecting Discord...</h1>
  <p class="message" id="status">Please wait while we link your Discord account.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ============================================
// COPY YOUR FIREBASE CONFIG HERE
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyA-FFDnHMuI2LkIm9w_SVD8SqjPul-mLzk",
  authDomain: "vouch-gg.firebaseapp.com",
  projectId: "vouch-gg",
  storageBucket: "vouch-gg.firebasestorage.app",
  messagingSenderId: "61282126994",
  appId: "1:61282126994:web:fbbb246bb13392f6b0ea4b"
};

// ============================================
// COPY YOUR DISCORD CONFIG HERE
// ============================================
const DISCORD_CLIENT_ID = "1496158778633224463";
const DISCORD_CLIENT_SECRET = "5HoVfVZNhYeMMG3J4eiWGlyG8Ge_WKzh";
const DISCORD_REDIRECT_URI = window.location.origin + "/discord-callback.html";

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Get code from URL
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');
const state = urlParams.get('state'); // This is the user's Firebase UID

if (!code || !state) {
  document.getElementById('status').textContent = 'Error: Missing authorization code';
  setTimeout(() => window.close(), 3000);
} else {
  exchangeCodeForToken(code, state);
}

async function exchangeCodeForToken(code, userId) {
  try {
    // Exchange code for access token
    const tokenResponse = await fetch('https://discord.com/api/oauth2/token', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams({
        client_id: DISCORD_CLIENT_ID,
        client_secret: DISCORD_CLIENT_SECRET,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: DISCORD_REDIRECT_URI,
      }),
    });

    if (!tokenResponse.ok) {
      throw new Error('Failed to exchange code for token');
    }

    const tokenData = await tokenResponse.json();
    const accessToken = tokenData.access_token;

    // Get user info
    const userResponse = await fetch('https://discord.com/api/users/@me', {
      headers: {
        Authorization: `Bearer ${accessToken}`,
      },
    });

    if (!userResponse.ok) {
      throw new Error('Failed to fetch user info');
    }

    const discordUser = await userResponse.json();

    // Get guilds
    const guildsResponse = await fetch('https://discord.com/api/users/@me/guilds', {
      headers: {
        Authorization: `Bearer ${accessToken}`,
      },
    });

    const guilds = guildsResponse.ok ? await guildsResponse.json() : [];

    // Check for Nitro (premium_type: 1 = Nitro Classic, 2 = Nitro)
    const hasNitro = discordUser.premium_type === 1 || discordUser.premium_type === 2;

    // Save to Firestore
    await db.collection('users').doc(userId).update({
      discord: {
        id: discordUser.id,
        username: discordUser.username,
        discriminator: discordUser.discriminator,
        avatar: discordUser.avatar,
        nitro: hasNitro,
        joined: discordUser.id ? calculateDiscordJoinDate(discordUser.id) : null,
        guilds: guilds.length,
        connectedAt: firebase.firestore.FieldValue.serverTimestamp()
      }
    });

    document.getElementById('status').innerHTML = '✅ Discord connected successfully!<br>You can close this window.';
    
    // Auto-close after 2 seconds
    setTimeout(() => {
      window.close();
      // If window.close() doesn't work (some browsers block it), redirect to main app
      window.location.href = '/vouch-app.html';
    }, 2000);

  } catch (error) {
    console.error('Discord connection error:', error);
    document.getElementById('status').textContent = '❌ Error: ' + error.message;
    setTimeout(() => window.close(), 3000);
  }
}

// Calculate Discord join date from Snowflake ID
function calculateDiscordJoinDate(userId) {
  const DISCORD_EPOCH = 1420070400000;
  const timestamp = (BigInt(userId) >> 22n) + BigInt(DISCORD_EPOCH);
  return new Date(Number(timestamp)).toISOString();
}
</script>
</body>
</html>
